# Replace with the globally unique Fly app name selected before first deploy.
app = "nexora-rifan214"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NEXORA_ENV = "production"
  NEXORA_DEBUG = "false"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  cpu_kind = "performance"
  cpus = 1
  memory = "1gb"
